# Shared lychee defaults for local checks and CI.
verbose = "info"
no_progress = true
max_retries = 2
retry_wait_time = 2
timeout = 20
max_concurrency = 8
accept = ["200..=206", 429]

exclude = [
  # Local app/demo URLs are expected to be unavailable in CI.
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # Badges and pages that only exist after the first release/deploy.
  '^https://img\.shields\.io/',
  '^https://badge\.fury\.io/',
  '^https://codecov\.io/gh/BramVanroy/bcql_py',
  '^https://pypi\.org/project/bcql_py',
  '^https://BramVanroy\.github\.io/bcql_py',
]
